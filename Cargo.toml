[package]
name = "lingohub"
version = "0.2.3"
edition = "2024"
rust-version = "1.98.1"
description = "Command-line client, terminal dashboard and MCP server for the LingoHub API"
license = "Apache-2.0"
repository = "https://github.com/lingohub/lingohub-cli"
homepage = "https://lingohub.com"
readme = "README.md"

[dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "query"] }
ratatui = "0.30.0"
crossterm = "0.29"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
# Preserve decimal lexemes during JSON pass-through; this feature unifies across the dependency graph.
# MCP compatibility is exercised by real stdio tests.
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
dotenvy = "0.15.7"
rustyline = "18.0.0"
rustyline-derive = "0.12.0"
clap-i18n-richformatter = "0.3.0"
clap_complete = "4.6.5"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
