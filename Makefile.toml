[tasks.fmt]
script = [
    "cargo fmt --all"
]

[tasks.clean]
command = "cargo"
args = ["clean"]

[tasks.build]
command = "cargo"
args = ["build"]

[tasks.fmt-build]
dependencies = ["fmt", "build"]

[tasks.full-build]
dependencies = ["clean", "fmt-build"]
